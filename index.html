<style>

;border:1px solid #334155;border-radius:12px;overflow:hidden;margin-bottom:12px}.card-pad{padding:14px 16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}.field input,.field select,.field textarea,.input-full{width:100%;border:1px solid #334155;border-radius:8px;padding:8px 10px;font-size:13px;background:#0f172a;color:#f1f5f9}.field textarea,.textarea{min-height:100px;resize:vertical}table{width:100%;border-collapse:collapse;font-size:13px}th{padding:9px 12px;text-align:left;font-size:11px;font-weight:700;color:#94a3b8;background:#0f172a;text-transform:uppercase;letter-spacing:.04em}th.tc,td.tc{text-align:center}td{padding:8px 12px;border-top:1px solid #334155;vertical-align:middle}tr:hover td{background:#0f172a}.pname{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;color:#f8fafc}.psub{font-size:11px;color:#94a3b8}.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}.badge-ok{background:#052e16;color:#86efac}.badge-low{background:#422006;color:#fcd34d}.badge-crit{background:#450a0a;color:#fecaca}.badge-in{background:#052e16;color:#86efac}.badge-out{background:#450a0a;color:#fecaca}.ni{width:72px;text-align:center;border:1px solid #334155;border-radius:6px;padding:5px 6px;font-size:13px;background:#0f172a;color:#f1f5f9}.ni-e{border-color:#22c55e}.ni-s{border-color:#ef4444}.btn{border:1px solid #334155;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;background:#1e293b;color:#e2e8f0;font-weight:600}.btn:hover{background:#334155}.btn-primary{background:#2563eb;color:#fff;border-color:#2563eb}.btn-primary:hover{background:#1d4ed8}.btn-sm{padding:5px 10px;font-size:12px}.btn-danger{color:#fecaca;border-color:#7f1d1d}.btn-danger:hover{background:#450a0a}.btn-full{width:100%;padding:11px}.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}.sec-hdr h3{font-size:15px;font-weight:700}.adj-panel,.info-box{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:14px;margin-bottom:12px}.info-box{background:#1e3a5f;border-color:#2563eb;color:#bfdbfe}.adj-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}.adj-row span{flex:1;font-size:12px;color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ns-pos{font-weight:700;color:#60a5fa}.ns-neg{font-weight:700;color:#f87171}.loading{text-align:center;padding:38px;color:#94a3b8;font-size:13px}.spinner{width:28px;height:28px;border:3px solid #334155;border-top-color:#60a5fa;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}.print-title{display:none}.muted{color:#94a3b8;font-size:12px}.admin-only{display:none}.admin .admin-only{display:inline-flex}.viewer .no-viewer{display:none!important}.export-modal{position:fixed;inset:0;z-index:100;background:rgba(2,6,23,.78);display:none;align-items:center;justify-content:center;padding:16px}.export-modal.open{display:flex}.export-card{width:min(520px,100%);background:#1e293b;border:1px solid #475569;border-radius:16px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.5)}.export-card h3{font-size:18px;margin-bottom:4px}.export-card .muted{margin-bottom:16px}.export-types{display:flex;gap:8px;margin-bottom:14px}.export-types button{flex:1}.export-types button.active{background:#2563eb;border-color:#2563eb;color:#fff}.export-range{display:none}.export-range.active{display:grid}.export-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media print{.no-print{display:none!important}.proj-header,.tabs-wrap,.header-actions,.back-btn,.btn-row,.feedback,.export-modal{display:none!important}body{background:#fff!important;color:#000!important;font-size:12px}.content{max-width:100%;padding:0}.card{border:1px solid #ccc;border-radius:0;box-shadow:none;background:#fff!important}table{font-size:11px;color:#000!important}th{background:#f0f0f0!important;color:#000!important;print-color-adjust:exact}td{color:#000!important;border-color:#ddd!important}.print-title{display:block!important;font-size:17px;font-weight:800;margin:0 0 12px;color:#000!important}.pname,.psub{color:#000!important}}@media(max-width:560px){.form-grid{grid-template-columns:1fr}.header-actions{gap:5px}.header-actions .btn{font-size:11px;padding:5px 8px}.proj-grid{grid-template-columns:repeat(2,1fr)}.pname{max-width:145px}.ni{width:56px}.tabs-wrap{top:48px}}

<body>
<div id="s-login" class="screen active"><div class="home-wrap"><p class="home-title">Control de Inventarios</p><p class="home-sub">SBM Corp — Acceso por proyecto</p><div class="login-card"><div class="field"><label>Código de acceso</label><input id="access-code" class="input-full" type="password" placeholder="Ejemplo: ADMIN2026" onkeydown="if(event.key==='Enter') login()"></div><div class="btn-row"><button class="btn btn-primary btn-full" onclick="login()">Ingresar</button></div><p class="muted" style="margin-top:10px">Cada encargada verá únicamente su proyecto. Admin ve todos los proyectos y configuración.</p></div></div></div>
<div id="s-home" class="screen"><div class="home-wrap"><p class="home-title">Control de Inventarios</p><p class="home-sub" id="home-sub">Seleccioná el proyecto</p><div id="loading-home" class="loading"><div class="spinner"></div>Cargando proyectos...</div><div class="proj-grid" id="proj-grid" style="display:none"></div><div id="home-project-admin" style="display:none;margin-top:16px"></div></div></div>
<div id="s-proj" class="screen"><div class="proj-header no-print"><button class="back-btn" id="back-btn" title="Volver">&#8592;</button><div class="proj-dot" id="hdr-dot" style="width:10px;height:10px;border-radius:50%"></div><span id="hdr-title" style="font-weight:700;font-size:15px"></span><span id="hdr-month" class="header-month"></span><span id="hdr-viewer-badge" style="display:none;background:#1e3a5f;color:#93c5fd;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid #2563eb">👁 Solo lectura</span><div class="header-actions no-print"><button class="btn btn-sm" onclick="openExportDialog('excel')" title="Exportar Excel">📊 Excel</button><button class="btn btn-sm" onclick="openExportDialog('pdf')" title="PDF / Imprimir">🖨️ PDF</button><button class="btn btn-sm btn-danger" onclick="logout()" title="Cerrar sesión">🚪 Salir</button></div></div>
<div class="tabs-wrap no-print"><div class="tabs" id="tabs"><button class="tab-btn active no-viewer" data-t="mov">Movimientos</button><button class="tab-btn" data-t="inv">Inventario</button><button class="tab-btn" data-t="ped" id="ped-tab">Pedido</button><button class="tab-btn no-viewer" data-t="count">Conteo físico</button><button class="tab-btn admin-tab" data-t="his">Historial</button><button class="tab-btn admin-tab" data-t="cfg">Config</button></div></div>
<div class="content"><div id="fbk" class="feedback"></div><div id="t-mov" class="tab-pane"></div><div id="t-inv" class="tab-pane" style="display:none"></div><div id="t-ped" class="tab-pane" style="display:none"></div><div id="t-count" class="tab-pane" style="display:none"></div><div id="t-his" class="tab-pane" style="display:none"></div><div id="t-cfg" class="tab-pane" style="display:none"></div></div></div>
<div id="export-modal" class="export-modal no-print" role="dialog" aria-modal="true" aria-labelledby="export-title"><div class="export-card"><h3 id="export-title">Descargar reporte</h3><p class="muted" id="export-subtitle">Seleccioná el mes o un período personalizado.</p><div class="export-types"><button class="btn active" id="mode-month" onclick="setExportMode('month')">Por mes</button><button class="btn" id="mode-range" onclick="setExportMode('range')">Por período</button></div><div id="export-month-box" class="field"><label>Mes del reporte</label><input id="export-month" type="month"></div><div id="export-range-box" class="form-grid export-range"><div class="field"><label>Desde</label><input id="export-from" type="date"></div><div class="field"><label>Hasta</label><input id="export-to" type="date"></div></div><div class="export-actions"><button class="btn" onclick="closeExportDialog()">Cancelar</button><button class="btn btn-primary" id="export-confirm" onclick="runFilteredExport()">Descargar</button></div></div></div>
<script>
const SUPA_URL = 'https://exuhbfsasoboxmksomar.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4dWhiZnNhc29ib3hta3NvbWFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4Mjk4NjYsImV4cCI6MjA5NTQwNTg2Nn0.Ao8l3NUkHxiDwWmK-GMpsBHgoQalFemb4Lf08yIyz4I';
async function sb(path, opts={}){const {prefer,...fetchOpts}=opts;const res=await fetch(SUPA_URL+'/rest/v1/'+path,{...fetchOpts,headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':prefer||'return=representation'}});if(!res.ok){throw new Error(await res.text())}const txt=await res.text();return txt?JSON.parse(txt):null}
const sGet=(t,q='')=>sb(t+(q?'?'+q:''),{method:'GET'}); const sPost=(t,data,prefer)=>sb(t,{method:'POST',body:JSON.stringify(data),prefer:prefer||'return=representation'}); const sPatch=(t,q,data)=>sb(t+'?'+q,{method:'PATCH',body:JSON.stringify(data)}); const sDel=(t,q)=>sb(t+'?'+q,{method:'DELETE'});
const now=new Date(), TODAY=now.toISOString().split('T')[0], CY=now.getFullYear(), CM=now.getMonth(), CD=now.getDate();
const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const ADMIN_CODE='V1LL41967!';
const DEFAULT_CODES={
 'Advant':'ADVANT2026',
 'Bayer Metro':'BAYER2026',
 'DXC':'DXC2026',
 'LSEG':'LSEG2026',
 'Uber Bambú':'BAMBU2026',
 'Uber Cedral':'CEDRAL2026',
 'Uber COE':'UBERCOE2026',
 'MCK':'MCK2026',
 'WPlaces':'WPLACES2026'
};
const LS_CODES_KEY='sbm_project_access_codes_v2';
// viewer_code se guarda en Supabase columna projects.viewer_code
function getViewerCode(pid){const p=projects.find(x=>x.id===pid);return (p&&p.viewer_code||'').toString().trim().toUpperCase()}
async function setViewerCode(pid,code){const c=(code||'').trim().toUpperCase();try{await sPatch('projects','id=eq.'+encodeURIComponent(pid),{viewer_code:c});const p=projects.find(x=>x.id===pid);if(p)p.viewer_code=c;}catch(e){console.error('Error guardando viewer_code',e)}}
function slugCode(name){return norm(name).replace(/[^a-z0-9]+/g,'').toUpperCase()+'2026'}
function getSavedCodes(){try{return JSON.parse(localStorage.getItem(LS_CODES_KEY)||'{}')}catch(e){return {}}}
function saveCodes(map){localStorage.setItem(LS_CODES_KEY,JSON.stringify(map||{}))}
function getProjectCode(p){const saved=getSavedCodes();return (saved[p.id]||p.access_code||DEFAULT_CODES[p.name]||slugCode(p.name)).toString().trim().toUpperCase()}
function setProjectCode(id,code){const saved=getSavedCodes();saved[id]=(code||'').toString().trim().toUpperCase();saveCodes(saved)}
let session=null, projects=[], products={}, stock={}, AP=null, AT='mov', MI={}, MD=TODAY, MR='', SA=false, AI={}, SAP=false, NP={name:'',unit:'PQT',em:''}, COUNT={}, importRows=[], selectedProducts=new Set();
function norm(v){return (v||'').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}
function roleProjects(){if(!session) return []; if(session.role==='admin') return projects; return projects.filter(p=>p.id===session.projectId)}
async function loadProjects(){projects=await sGet('projects','order=name')||[];return projects}
async function login(){
  const code=document.getElementById('access-code').value.trim().toUpperCase();
  if(!code){alert('Ingresá el código de acceso');return}
  try{await loadProjects()}catch(e){alert('No se pudo conectar con Supabase: '+e.message);return}
  if(code===ADMIN_CODE){session={role:'admin',name:'Admin',projectId:null};}
  else{
    const p=projects.find(x=>getProjectCode(x)===code);
    if(p){session={role:'user',name:p.name,projectId:p.id};}
    else{
      const vp=projects.find(x=>x.viewer_code&&x.viewer_code.toString().trim().toUpperCase()===code);
      if(vp)session={role:'viewer',name:vp.name,projectId:vp.id};
    }
    if(!session){alert('Código incorrecto');return}
  }
  document.body.classList.toggle('admin',session.role==='admin');
  document.body.classList.toggle('viewer',session.role==='viewer');
  document.querySelectorAll('.admin-tab').forEach(b=>b.style.display=session.role==='admin'?'inline-block':'none');
  document.querySelectorAll('.no-viewer').forEach(b=>b.style.display=session.role==='viewer'?'none':'');
  document.getElementById('s-login').classList.remove('active');
  document.getElementById('s-home').classList.add('active');
  document.getElementById('home-sub').textContent=session.role==='admin'?'Admin — todos los proyectos':session.role==='viewer'?'👁 Vista consulta: '+session.name:'Acceso: '+session.name;
  init();
}
async function init(){try{if(!projects.length) await loadProjects();document.getElementById('loading-home').style.display='none';document.getElementById('proj-grid').style.display='grid';renderHome()}catch(e){document.getElementById('loading-home').innerHTML='⚠️ Error al conectar con Supabase.'}}
function renderHome(){const list=roleProjects(); document.getElementById('proj-grid').innerHTML=list.map(p=>`<div class="proj-card" onclick="openProject('${p.id}')"><div class="proj-dot" style="background:${p.color||'#3b82f6'}"></div><div class="proj-name">${p.name}</div><div class="proj-count">Toca para abrir</div></div>`).join('') || '<div class="loading">No hay proyecto asignado a este código.</div>'; renderHomeProjectAdmin();}
async function openProject(pid){
  if(session && session.role==='viewer' && session.projectId !== pid) return;AP=pid;AT=session&&session.role==='viewer'?'inv':'mov';MI={};MD=TODAY;MR='';SA=false;AI={};SAP=false;COUNT={};importRows=[];const p=projects.find(x=>x.id===pid);document.getElementById('s-home').classList.remove('active');document.getElementById('s-proj').classList.add('active');document.getElementById('hdr-dot').style.background=p.color||'#3b82f6';
  const vbadge=document.getElementById('hdr-viewer-badge');if(vbadge)vbadge.style.display=session&&session.role==='viewer'?'inline-block':'none';document.getElementById('hdr-title').textContent=p.name;document.getElementById('hdr-month').textContent=MONTHS[CM]+' '+CY;document.getElementById('ped-tab').textContent='Pedido'+(CD>=18?' 🔔':'');document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.t===(session&&session.role==='viewer'?'inv':'mov')));hideFbk();const _dt=session&&session.role==='viewer'?'inv':'mov';showTabLoading(_dt);try{const prods=await sGet('products','project_id=eq.'+encodeURIComponent(pid)+'&order=name');products[pid]=prods||[];const stk=await sGet('stock','project_id=eq.'+encodeURIComponent(pid));stock[pid]={};(stk||[]).forEach(s=>stock[pid][s.product_id]=parseFloat(s.qty)||0)}catch(e){showFbk('⚠️ Error cargando datos: '+e.message,'warn')}showTab(session&&session.role==='viewer'?'inv':'mov')}
document.getElementById('back-btn').onclick=()=>{document.getElementById('s-home').classList.add('active');document.getElementById('s-proj').classList.remove('active');AP=null;renderHome()};

function logout(){
  session=null;
  AP=null;
  AT='mov';
  MI={};
  MR='';
  SA=false;
  AI={};
  SAP=false;
  COUNT={};
  importRows=[];
  selectedProducts=new Set();

  document.body.classList.remove('admin');
  document.querySelectorAll('.admin-tab').forEach(b=>b.style.display='none');

  document.getElementById('access-code').value='';
  document.getElementById('s-proj').classList.remove('active');
  document.getElementById('s-home').classList.remove('active');
  document.getElementById('s-login').classList.add('active');

  hideFbk();
  setTimeout(()=>document.getElementById('access-code').focus(),50);
}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('.tab-btn');if(!b)return;if(session.role!=='admin' && ['his','cfg'].includes(b.dataset.t)) return; if(session.role==='viewer' && b.dataset.t==='mov') return;document.querySelectorAll('.tab-btn').forEach(x=>x.classList.toggle('active',x.dataset.t===b.dataset.t));AT=b.dataset.t;showTab(AT)};
function showTab(t){document.querySelectorAll('.tab-pane').forEach(p=>p.style.display='none');document.getElementById('t-'+t).style.display='block';hideFbk();if(t==='mov')renderMov();else if(t==='inv')renderInv();else if(t==='ped')renderPed();else if(t==='count')renderCount();else if(t==='his')renderHis();else if(t==='cfg')renderCfg()}
function showTabLoading(t){document.getElementById('t-'+t).innerHTML='<div class="loading"><div class="spinner"></div>Cargando...</div>'}
function getStock(id){return stock[AP]?.[id]??0} function getProds(){return products[AP]||[]}
function renderMov(){const el=document.getElementById('t-mov'); if(!getProds().length){el.innerHTML='<div class="loading">No hay productos configurados.</div>';return} const rows=getProds().map(p=>{const cur=getStock(p.id);return `<tr><td><span class="pname" title="${p.name}">${p.name}</span><span class="psub">${p.unit||''}</span></td><td class="tc"><b>${cur}</b></td><td class="tc"><input class="ni ni-e" type="number" min="0" step="1" placeholder="0" oninput="setInput('${p.id}','e',this.value)"></td><td class="tc"><input class="ni ni-s" type="number" min="0" step="1" placeholder="0" oninput="setInput('${p.id}','s',this.value)"></td><td class="tc" id="ns-${p.id}"><span style="color:#94a3b8">—</span></td></tr>`}).join(''); el.innerHTML=`<div class="card card-pad"><div class="form-grid"><div class="field"><label>Fecha</label><input type="date" value="${MD}" onchange="MD=this.value"></div><div class="field"><label>Responsable</label><input type="text" placeholder="Nombre" value="${MR}" oninput="MR=this.value"></div></div></div><div class="card" style="overflow-x:auto"><table><thead><tr><th>Producto</th><th class="tc">Stock act.</th><th class="tc">Entrada</th><th class="tc">Salida</th><th class="tc">Nuevo saldo</th></tr></thead><tbody>${rows}</tbody></table></div><button class="btn btn-primary btn-full no-print" onclick="registerMovements()">✓ Registrar Movimientos</button>`}
function setInput(id,f,v){if(!MI[id])MI[id]={e:'',s:''};MI[id][f]=v;const cur=getStock(id), ev=parseFloat(MI[id].e)||0, sv=parseFloat(MI[id].s)||0, nw=cur+ev-sv;const el=document.getElementById('ns-'+id);if(el)el.innerHTML=(ev>0||sv>0)?`<span class="${nw<0?'ns-neg':'ns-pos'}">${nw}</span>`:'<span style="color:#94a3b8">—</span>'}
async function registerMovements(){if(!MD||!MR.trim()){showFbk('⚠️ Ingresá fecha y responsable','warn');return}const entries=[], ns={...(stock[AP]||{})};for(const p of getProds()){const inp=MI[p.id]||{}, e=parseFloat(inp.e)||0, s=parseFloat(inp.s)||0, ts=Date.now();if(e>0){entries.push({id:`${ts}-${p.id}-e`,project_id:AP,product_id:p.id,type:'entrada',qty:e,date:MD,responsable:MR.trim()});ns[p.id]=(ns[p.id]??0)+e}if(s>0){entries.push({id:`${ts}-${p.id}-s`,project_id:AP,product_id:p.id,type:'salida',qty:s,date:MD,responsable:MR.trim()});ns[p.id]=(ns[p.id]??0)-s}}if(!entries.length){showFbk('⚠️ No hay movimientos para registrar','warn');return}try{await sPost('movements',entries);await sPost('stock',Object.entries(ns).map(([product_id,qty])=>({project_id:AP,product_id,qty})),'resolution=merge-duplicates');stock[AP]=ns;MI={};renderMov();showFbk('✅ Movimientos registrados','ok')}catch(e){showFbk('⚠️ Error al guardar: '+e.message,'warn')}}
function renderInv(){const adj=SA?`<div class="adj-panel"><p style="font-weight:700;margin-bottom:10px">📦 Stock físico actual</p>${getProds().map(p=>`<div class="adj-row"><span>${p.name}</span><input class="ni" type="number" min="0" value="${AI[p.id]??getStock(p.id)}" oninput="AI['${p.id}']=this.value"></div>`).join('')}<div class="btn-row"><button class="btn btn-primary" onclick="saveAdj()">Guardar</button><button class="btn" onclick="SA=false;renderInv()">Cancelar</button></div></div>`:''; const rows=getProds().map(p=>{const s=getStock(p.id), exp=parseFloat(p.expected_monthly)||0, r=exp>0?s/exp:1, st=r<=.2?['Crítico','badge-crit']:r<=.5?['Bajo','badge-low']:['OK','badge-ok'];return `<tr><td><span class="pname">${p.name}</span><span class="psub">${p.unit||''}</span></td><td class="tc"><b>${s}</b></td><td class="tc">${exp}</td><td class="tc"><span class="badge ${st[1]}">${st[0]}</span></td></tr>`}).join('');document.getElementById('t-inv').innerHTML=`<div class="print-title" id="print-inv-title"></div><div class="sec-hdr no-print"><h3>Stock Actual</h3><button class="btn btn-sm no-viewer" onclick="SA=true;AI={};renderInv()">✏️ Ajustar stock</button></div>${adj}<div class="card" style="overflow-x:auto"><table><thead><tr><th>Producto</th><th class="tc">Stock</th><th class="tc">Mínimo mensual</th><th class="tc">Estado</th></tr></thead><tbody>${rows}</tbody></table></div>`}
async function saveAdj(){const ns={...(stock[AP]||{})}, updates=[];for(const [k,v] of Object.entries(AI)){const n=parseFloat(v);if(!isNaN(n)&&n>=0){ns[k]=n;updates.push({project_id:AP,product_id:k,qty:n})}}if(!updates.length)return;try{await sPost('stock',updates,'resolution=merge-duplicates');stock[AP]=ns;SA=false;AI={};renderInv();showFbk('✅ Stock guardado','ok')}catch(e){showFbk('⚠️ Error: '+e.message,'warn')}}
async function renderPed(){const el=document.getElementById('t-ped');showTabLoading('ped');try{const firstDay=`${CY}-${String(CM+1).padStart(2,'0')}-01`;const movs=await sGet('movements',`project_id=eq.${encodeURIComponent(AP)}&type=eq.salida&date=gte.${firstDay}&order=date`);const order=getProds().map(p=>{const sal=(movs||[]).filter(m=>m.product_id===p.id).reduce((a,m)=>a+parseFloat(m.qty||0),0);const proj=CD>=7?Math.ceil(sal*30/CD):(parseFloat(p.expected_monthly)||0);const tgt=Math.max(proj,parseFloat(p.expected_monthly)||0), cur=getStock(p.id);return {p,cur,sal,proj,sug:Math.max(0,Math.ceil(tgt*1.2)-cur)}});const need=order.filter(o=>o.sug>0), ok=order.filter(o=>o.sug===0);el.innerHTML=`<div class="print-title" id="print-ped-title"></div><div class="info-box"><b>📦 Pedido sugerido — ${MONTHS[(CM+1)%12]} ${CY}</b><br><span class="muted">Mínimo mensual de ${MONTHS[CM]} · Stock seguridad 20%</span></div>${!need.length?'<div class="loading">✅ Todos los productos tienen stock suficiente</div>':`<div class="card" style="overflow-x:auto"><table><thead><tr><th>Producto</th><th class="tc">Stock act.</th><th class="tc">Consumido mes</th><th class="tc">A pedir</th></tr></thead><tbody>${need.map(({p,cur,sal,sug})=>`<tr><td><span class="pname">${p.name}</span><span class="psub">${p.unit||''}</span></td><td class="tc">${cur}</td><td class="tc">${sal}</td><td class="tc"><b>${sug}</b></td></tr>`).join('')}</tbody></table></div>`}${ok.length?`<p class="muted">Productos con stock suficiente: ${ok.length}</p>`:''}`}catch(e){el.innerHTML='<div class="loading">⚠️ Error: '+e.message+'</div>'}}
function renderCount(){const rows=getProds().map(p=>`<tr><td><span class="pname">${p.name}</span><span class="psub">Actual: ${getStock(p.id)} ${p.unit||''}</span></td><td class="tc"><input class="ni" type="number" min="0" value="${COUNT[p.id]??''}" oninput="COUNT['${p.id}']=this.value"></td></tr>`).join('');document.getElementById('t-count').innerHTML=`<div class="sec-hdr"><h3>Conteo físico</h3><div class="btn-row" style="margin:0"><button class="btn btn-sm" onclick="clearCount()">Limpiar conteo</button><button class="btn btn-sm" onclick="exportCountExcel()">📊 Excel conteo</button><button class="btn btn-primary btn-sm" onclick="applyCountToStock()">Aplicar al stock</button></div></div><div class="info-box">Este módulo es manual por ahora: tomás fotos, se revisa el conteo y aquí se digitan las cantidades finales.</div><div class="card" style="overflow-x:auto"><table><thead><tr><th>Producto</th><th class="tc">Conteo físico</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function clearCount(){COUNT={};renderCount()} async function applyCountToStock(){const updates=[];for(const [k,v] of Object.entries(COUNT)){const n=parseFloat(v);if(!isNaN(n)&&n>=0)updates.push({project_id:AP,product_id:k,qty:n})}if(!updates.length){showFbk('⚠️ No hay conteo para aplicar','warn');return}if(!confirm('Esto reemplazará el stock actual por el conteo físico digitado. ¿Continuar?'))return;try{await sPost('stock',updates,'resolution=merge-duplicates');updates.forEach(u=>stock[AP][u.product_id]=u.qty);showFbk('✅ Conteo aplicado al stock','ok');renderCount()}catch(e){showFbk('⚠️ Error: '+e.message,'warn')}}
function exportCountExcel(){const data=[['Producto','Unidad','Stock actual','Conteo físico']];getProds().forEach(p=>data.push([p.name,p.unit||'',getStock(p.id),COUNT[p.id]??'']));const wb=XLSX.utils.book_new(), ws=XLSX.utils.aoa_to_sheet(data);ws['!cols']=[{wch:50},{wch:12},{wch:14},{wch:14}];XLSX.utils.book_append_sheet(wb,ws,'Conteo físico');XLSX.writeFile(wb,`Conteo_${(projects.find(p=>p.id===AP)?.name||AP)}_${TODAY}.xlsx`)}
async function renderHis(){const el=document.getElementById('t-his');showTabLoading('his');try{const movs=await sGet('movements',`project_id=eq.${encodeURIComponent(AP)}&order=created_at.desc&limit=100`);const prods=getProds();if(!movs?.length){el.innerHTML='<div class="loading">No hay movimientos registrados</div>';return}el.innerHTML=`<h3 style="margin-bottom:12px">Últimos movimientos</h3><div class="card" style="overflow-x:auto"><table><thead><tr><th>Tipo</th><th>Producto</th><th>Fecha</th><th>Responsable</th></tr></thead><tbody>${movs.map(m=>{const p=prods.find(x=>x.id===m.product_id);return `<tr><td><span class="badge ${m.type==='entrada'?'badge-in':'badge-out'}">${m.type==='entrada'?'+':'-'}${m.qty}</span></td><td><span class="pname">${p?.name||m.product_id}</span></td><td>${m.date}</td><td>${m.responsable||''}</td></tr>`}).join('')}</tbody></table></div>`}catch(e){el.innerHTML='<div class="loading">⚠️ Error: '+e.message+'</div>'}}
function renderCfg(){const prods=getProds();selectedProducts=new Set([...selectedProducts].filter(id=>prods.some(p=>p.id===id)));const addForm=SAP?`<div class="adj-panel"><p style="font-weight:700;margin-bottom:10px">➕ Agregar producto directo</p><p class="muted" style="margin-bottom:10px">Aquí puedes agregar un producto manualmente y definir el mínimo mensual que debe mantenerse para el pedido sugerido.</p><div class="form-grid"><div class="field"><label>Producto</label><input value="${NP.name}" placeholder="Ej. Toalla Tork H1" oninput="NP.name=this.value"></div><div class="field"><label>Unidad</label><input value="${NP.unit}" placeholder="Caja, unidad, paquete..." oninput="NP.unit=this.value"></div><div class="field"><label>Mínimo mensual requerido</label><input type="number" min="0" step="1" value="${NP.em}" placeholder="Ej. 10" oninput="NP.em=this.value"></div></div><div class="btn-row"><button class="btn btn-primary" onclick="addProduct()">Guardar producto</button><button class="btn" onclick="SAP=false;renderCfg()">Cancelar</button></div></div>`:'';document.getElementById('t-cfg').innerHTML=`<div class="sec-hdr"><h3>Config Admin</h3><button class="btn btn-primary btn-sm" onclick="SAP=true;NP={name:'',unit:'PQT',em:''};renderCfg()">+ Agregar producto directo</button></div>${addForm}${renderImporter()}${renderStockUpdater()}${renderProjectManager()}<div class="info-box"><b>📌 Mínimo mensual requerido</b><br><span class="muted">Este número es la cantidad mínima que se recomienda tener para el mes. No se mueve con entradas ni salidas; se usa como referencia para estado y pedido sugerido.</span></div><div class="card card-pad"><b>Limpieza masiva de productos</b><p style="font-size:12px;color:#94a3b8;margin-top:4px">Seleccioná varios productos y borralos juntos. Esto también elimina su stock y movimientos asociados en este proyecto.</p><div class="btn-row"><button class="btn" onclick="selectAllProducts(true)">Seleccionar todos</button><button class="btn" onclick="selectAllProducts(false)">Limpiar selección</button><button class="btn btn-danger" onclick="deleteSelectedProducts()">🗑 Borrar seleccionados</button></div><p style="font-size:12px;color:#cbd5e1;margin-top:8px" id="sel-count">Seleccionados: ${selectedProducts.size}</p></div><div class="card" style="overflow-x:auto"><table><thead><tr><th class="tc">Sel.</th><th>Producto</th><th class="tc">Presentación / unidad</th><th class="tc">Mínimo mensual</th><th class="tc">Acciones</th></tr></thead><tbody>${prods.map(p=>`<tr><td class="tc"><input type="checkbox" ${selectedProducts.has(p.id)?'checked':''} onchange="toggleProductSelect('${p.id}',this.checked)"></td><td><input class="input-full" id="prod-name-${p.id}" value="${p.name}" style="min-width:190px"></td><td class="tc"><input class="input-full" id="prod-unit-${p.id}" value="${p.unit||''}" style="min-width:110px"></td><td class="tc"><input class="input-full" id="prod-exp-${p.id}" type="number" min="0" step="1" value="${p.expected_monthly||0}" style="min-width:90px"></td><td class="tc"><button class="btn btn-sm" onclick="updateProduct('${p.id}')">💾</button> <button class="btn btn-sm btn-danger" onclick="deleteProduct('${p.id}')">🗑</button></td></tr>`).join('')}</tbody></table></div>`;}
function renderImporter(){return `<div class="adj-panel"><h3 style="margin-bottom:8px">📥 Importar productos</h3><p class="muted" style="margin-bottom:8px">Puedes subir Excel/CSV o pegar una lista. Columnas recomendadas: Producto, Unidad, Mínimo mensual requerido, Stock inicial.</p><div class="form-grid"><div class="field"><label>Subir Excel/CSV</label><input type="file" accept=".xlsx,.xls,.csv" onchange="handleImportFile(event)"></div><div class="field"><label>Pegar lista</label><textarea id="paste-products" placeholder="Producto | Unidad | Mínimo mensual requerido | Stock inicial"></textarea></div></div><div class="btn-row"><button class="btn" onclick="previewPastedProducts()">Vista previa</button><button class="btn btn-primary" onclick="importProducts()">Cargar productos</button></div><div id="import-preview" style="margin-top:10px"></div></div>`}
function parseProductRows(rows){return rows.map(r=>Array.isArray(r)?{name:r[0],unit:r[1]||'Unidad',expected_monthly:r[2]||0,stock_initial:r[3]||0}:r).filter(r=>r.name&&norm(r.name)!=='producto').map(r=>({name:String(r.name).trim(),unit:String(r.unit||'Unidad').trim(),expected_monthly:parseFloat(r.expected_monthly)||0,stock_initial:parseFloat(r.stock_initial)||0}))}
function previewRows(){document.getElementById('import-preview').innerHTML=importRows.length?`<p class="muted">Vista previa: ${importRows.length} productos detectados.</p><div class="card" style="max-height:220px;overflow:auto"><table><thead><tr><th>Producto</th><th>Unidad</th><th>Mínimo mensual</th><th>Stock inicial</th></tr></thead><tbody>${importRows.slice(0,50).map(r=>`<tr><td>${r.name}</td><td>${r.unit}</td><td>${r.expected_monthly}</td><td>${r.stock_initial}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No hay productos para importar.</p>'}
function handleImportFile(ev){const f=ev.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=e=>{const data=new Uint8Array(e.target.result), wb=XLSX.read(data,{type:'array'}), ws=wb.Sheets[wb.SheetNames[0]], arr=XLSX.utils.sheet_to_json(ws,{header:1});let start=0;if(arr[0]&&norm(arr[0][0]).includes('producto'))start=1;importRows=parseProductRows(arr.slice(start));previewRows()};reader.readAsArrayBuffer(f)}
function previewPastedProducts(){const txt=document.getElementById('paste-products').value||'';const rows=txt.split(/\n+/).map(line=>line.split(/\t|,|;|\|/).map(x=>x.trim())).filter(r=>r[0]);importRows=parseProductRows(rows);previewRows()}
async function importProducts(){if(!importRows.length){previewPastedProducts()} if(!importRows.length){showFbk('⚠️ No hay productos para importar','warn');return}const existing=new Set(getProds().map(p=>norm(p.name)));const missing=importRows.filter(r=>!existing.has(norm(r.name)));if(!missing.length){showFbk('✅ No hay productos nuevos; todos estaban cargados.','ok');return}const stamp=Date.now();const rows=missing.map((r,i)=>({id:AP+'-imp-'+stamp+'-'+i,project_id:AP,name:r.name,unit:r.unit,expected_monthly:r.expected_monthly}));try{await sPost('products',rows);const stockRows=rows.map((p,i)=>({project_id:AP,product_id:p.id,qty:missing[i].stock_initial||0}));await sPost('stock',stockRows,'resolution=merge-duplicates');products[AP]=getProds().concat(rows).sort((a,b)=>a.name.localeCompare(b.name));if(!stock[AP])stock[AP]={};stockRows.forEach(s=>stock[AP][s.product_id]=s.qty);showFbk('✅ Se importaron '+rows.length+' productos sin duplicar.','ok');importRows=[];renderCfg()}catch(e){showFbk('⚠️ Error importando: '+e.message,'warn')}}

function renderStockUpdater(){return `<div class="adj-panel"><h3 style="margin-bottom:8px">🔁 Actualizar stock por lista</h3><p class="muted" style="margin-bottom:8px">Pega una lista con Producto y Stock actual. Esto NO crea productos nuevos; solo actualiza cantidades de productos que ya existen en este proyecto.</p><textarea id="paste-stock" class="input-full" placeholder="Producto | Stock actual\nFrescoleche vainilla | 9\nCoca Cola mini | 2"></textarea><div class="btn-row"><button class="btn" onclick="previewStockPaste()">Vista previa stock</button><button class="btn btn-primary" onclick="applyStockPaste()">Actualizar stock</button></div><div id="stock-preview" style="margin-top:10px"></div></div>`}
let stockPasteRows=[];
function parseStockPaste(){const txt=document.getElementById('paste-stock')?.value||'';stockPasteRows=txt.split(/\n+/).map(line=>line.split(/\t|,|;|\|/).map(x=>x.trim())).filter(r=>r[0]&&r[1]!==undefined).map(r=>({name:r[0],qty:parseFloat(String(r[1]).replace(',','.'))})).filter(r=>r.name&&!isNaN(r.qty)&&r.qty>=0);return stockPasteRows}
function previewStockPaste(){const rows=parseStockPaste();const prods=getProds();const mapped=rows.map(r=>{const p=prods.find(x=>norm(x.name)===norm(r.name))||prods.find(x=>norm(x.name).includes(norm(r.name))||norm(r.name).includes(norm(x.name)));return {...r, product:p}});document.getElementById('stock-preview').innerHTML=mapped.length?`<p class="muted">${mapped.filter(x=>x.product).length} coincidencias / ${mapped.length} líneas.</p><div class="card" style="max-height:220px;overflow:auto"><table><thead><tr><th>Producto pegado</th><th>Coincidencia</th><th class="tc">Nuevo stock</th></tr></thead><tbody>${mapped.map(r=>`<tr><td>${r.name}</td><td>${r.product?r.product.name:'⚠️ No encontrado'}</td><td class="tc">${r.qty}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No hay líneas válidas para actualizar.</p>';return mapped}
async function applyStockPaste(){const mapped=previewStockPaste().filter(r=>r.product);if(!mapped.length){showFbk('⚠️ No hay productos coincidentes para actualizar','warn');return}if(!confirm('Esto actualizará el stock actual de '+mapped.length+' producto(s). ¿Continuar?'))return;const updates=mapped.map(r=>({project_id:AP,product_id:r.product.id,qty:r.qty}));try{await sPost('stock',updates,'resolution=merge-duplicates');updates.forEach(u=>{if(!stock[AP])stock[AP]={};stock[AP][u.product_id]=u.qty});showFbk('✅ Stock actualizado desde lista pegada','ok');renderCfg()}catch(e){showFbk('⚠️ Error actualizando stock: '+e.message,'warn')}}

async function addProjectFromHome(){
  const name=document.getElementById('home-new-proj-name').value.trim(), color=document.getElementById('home-new-proj-color').value||'#2563eb';
  const code=(document.getElementById('home-new-proj-code').value.trim()||slugCode(name)).toUpperCase();
  if(!name){alert('Escribí el nombre del proyecto');return}
  const id=norm(name).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString().slice(-4);
  try{const row={id,name,color};const res=await sPost('projects',row);projects.push(res?.[0]||row);setProjectCode(id,code);projects.sort((a,b)=>a.name.localeCompare(b.name));renderHome();}
  catch(e){alert('Error creando proyecto: '+e.message)}
}
async function updateProject(id){
  const name=document.getElementById('edit-name-'+id).value.trim(), color=document.getElementById('edit-color-'+id).value||'#2563eb';
  const code=document.getElementById('edit-code-'+id).value.trim().toUpperCase();
  if(!name){alert('El nombre no puede quedar vacío');return}
  if(!code){alert('El código no puede quedar vacío');return}
  try{await sPatch('projects','id=eq.'+encodeURIComponent(id),{name,color});const p=projects.find(x=>x.id===id);if(p){p.name=name;p.color=color}setProjectCode(id,code);renderHome();}
  catch(e){alert('Error actualizando proyecto: '+e.message)}
}

async function updateProduct(id){
  const name=document.getElementById('prod-name-'+id)?.value.trim();
  const unit=document.getElementById('prod-unit-'+id)?.value.trim()||'Unidad';
  const exp=parseFloat(document.getElementById('prod-exp-'+id)?.value)||0;
  if(!name){showFbk('⚠️ El producto no puede quedar vacío','warn');return}

    await sPatch('products','id=eq.'+encodeURIComponent(id),{name,unit,expected_monthly:exp});

  const el=document.getElementById('sel-count');
  if(el) el.textContent='Seleccionados: '+selectedProducts.size;

function selectAllProducts(flag){
  selectedProducts = flag ? new Set(getProds().map(p=>p.id)) : new Set();
  renderCfg();
}
async function deleteSelectedProducts(){
  const ids=[...selectedProducts];
  if(!ids.length){showFbk('⚠️ No hay productos seleccionados','warn');return;}
  if(!confirm('¿Eliminar '+ids.length+' producto(s) seleccionados? También se eliminará su stock y movimientos asociados.'))return;
  try{
    for(const id of ids){
      await sDel('stock','product_id=eq.'+encodeURIComponent(id));
      await sDel('movements','product_id=eq.'+encodeURIComponent(id));
      await sDel('products','id=eq.'+encodeURIComponent(id));
      if(stock[AP]) delete stock[AP][id];
    }
    products[AP]=products[AP].filter(p=>!selectedProducts.has(p.id));
    selectedProducts=new Set();
    renderCfg();
    showFbk('✅ Productos eliminados correctamente','ok');
  }catch(e){showFbk('⚠️ Error al borrar productos: '+e.message,'warn')}
}

async function exportExcel(expMonth, expYear){

    const ld=new Date(y,m+1,0);
    const ldStr=`${y}-${String(m+1).padStart(2,'0')}-${String(ld.getDate()).padStart(2,'0')}`;
    const movs=await sGet('movements',`project_id=eq.${encodeURIComponent(AP)}&type=eq.salida&date=gte.${fd}&date=lte.${ldStr}`);
    const diasT=m===CM&&y===CY?CD:ld.getDate();
    const nextM=MONTHS[(m+1)%12],nextY=(m+1)>11?y+1:y;
    const wsPed=wb.addWorksheet(`Pedido ${nextM} ${nextY}`);
    wsPed.columns=[{width:6},{width:50},{width:10},{width:14},{width:18},{width:20},{width:22},{width:16}];
    addTitle(wsPed,projName,`Para ${nextM} ${nextY}`,'Pedido Sugerido');
    const ph=wsPed.addRow(['N°','Producto','Unidad','Stock Actual','Consumido en el Mes','Consumo Proyectado','Stock Seguridad (20%)','Pedido Sugerido']);
    styleHeader(ph);wsPed.views=[{state:'frozen',ySplit:4}];
    let hay=false,n=0;
    prods.forEach(p=>{
      const sal=(movs||[]).filter(mv=>mv.product_id===p.id).reduce((a,mv)=>a+parseFloat(mv.qty),0);
      const pr2=diasT>=7?Math.ceil(sal*30/diasT):parseFloat(p.expected_monthly)||0;
      const tgt=Math.max(pr2,parseFloat(p.expected_monthly)||0);
      const cur=stk[p.id]??0,seg=Math.ceil(tgt*0.2),sug=Math.max(0,Math.ceil(tgt)+seg-cur);
      if(sug>0){
        hay=true;n++;
        const row=wsPed.addRow([n,p.name,p.unit||'',cur,sal,pr2,seg,sug]);
        row.height=18;
        const bg=n%2===0?C.white:C.gray1;
        row.eachCell(cell=>{cell.fill=fill(bg);cell.font=font({});cell.border=border();cell.alignment=align('left','middle');});
        [1,4,5,6,7,8].forEach(c=>row.getCell(c).alignment=align('center','middle'));
        const sc=row.getCell(8);sc.fill=fill(C.navyMid);sc.font=font({bold:true,color:C.white,size:12});sc.alignment=align('center','middle');
      }
    });
    if(!hay){
      const r=wsPed.addRow(['','✅ Stock suficiente para todos los productos','','','','','','']);
      wsPed.mergeCells(`B${r.number}:H${r.number}`);
      r.getCell(2).font=font({bold:true,color:C.green});r.getCell(2).fill=fill(C.greenBg);
    }
  }catch(e){console.error(e)}

  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`Inventario_${projName}_${mesNombre}_${expYear}.xlsx`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function printView(){const proj=projects.find(p=>p.id===AP);const title=`${proj?.name||AP} — ${AT==='ped'?'Pedido Sugerido':'Inventario'} — ${MONTHS[CM]} ${CY}`;if(AT!=='inv'&&AT!=='ped'){goTab('inv');setTimeout(()=>{const el=document.getElementById('print-inv-title');if(el)el.textContent=title;window.print()},300)}else{const el=document.getElementById(AT==='ped'?'print-ped-title':'print-inv-title');if(el)el.textContent=title;window.print()}}
function goTab(t){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.t===t));AT=t;showTab(t)} function showFbk(msg,type){const el=document.getElementById('fbk');el.textContent=msg;el.className='feedback '+type;el.style.display='block';setTimeout(()=>el.style.display='none',4500)} function hideFbk(){const el=document.getElementById('fbk');if(el)el.style.display='none'}
</script>
</body>
